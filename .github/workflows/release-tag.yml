name: Release — Tag & Publish

# Step 3 of the two-step Release Flow: fires automatically once a
# release/vX.Y.Z -> main PR (opened by "Release — Open Promotion PRs") is
# merged by a human. At that point the code is already on main through a
# reviewed PR — nothing here needs to bypass branch protection, it only
# adds a tag and a GitHub Release on top of a merge that already happened.
#
# Publishing the images (publish-api-image.yml / publish-base-image.yml, which
# move the floating `stable` tag the Hetzner VM pulls) is NOT triggered by the
# tag push below: GitHub does not start workflow runs from events created with
# the default GITHUB_TOKEN (workflow_dispatch and repository_dispatch are the
# only exceptions), so those workflows' `tags: v*` trigger never fires for a
# tag pushed from here. v1.0.0 - v1.0.2 shipped that way and `stable` stayed on
# the v0.1.3 image, which kept serving fixed-in-main bugs in production. The
# "Publish images" step therefore dispatches both workflows explicitly against
# the new tag ref. This workflow still does not deploy to the VM — there's no
# CD hook to it; picking up `stable` there is a manual
# `docker compose -f docker-compose.hosted.yml pull && up -d`.

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write
  # Required for `gh workflow run` (workflow_dispatch) in the publish step.
  actions: write

jobs:
  tag-and-release:
    name: Tag and publish the merged release
    if: |
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Derive version from the release branch name
        id: version
        run: |
          ref="${{ github.event.pull_request.head.ref }}"
          version="${ref#release/v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Couldn't parse a plain semver out of branch '$ref'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Tag the release
        run: |
          git tag -a "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "Whiparc v${{ steps.version.outputs.version }}" \
            --target main \
            --generate-notes

      # Dispatch against the tag ref (not main): the publish workflows decide
      # what to tag from github.ref, and `refs/tags/vX.Y.Z` is what makes them
      # publish the immutable vX.Y.Z tag and move `stable`. Base image first so
      # it is queued ahead of the API image that builds on its `stable` tag.
      - name: Publish images for the new tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          gh workflow run publish-base-image.yml --repo "${{ github.repository }}" --ref "$tag"
          gh workflow run publish-api-image.yml --repo "${{ github.repository }}" --ref "$tag"

      - name: Summary
        run: |
          {
            echo "### Shipped v${{ steps.version.outputs.version }}"
            echo ""
            echo "- Tagged \`v${{ steps.version.outputs.version }}\` on \`main\`"
            echo "- GitHub Release created"
            echo "- Image publishing dispatched on the tag (publish-base-image.yml / publish-api-image.yml) — check the Actions tab that both succeed before pulling \`stable\`"
            echo "- Still manual: pull \`stable\` on the Hetzner VM"
            echo "- Don't forget the \`release/v${{ steps.version.outputs.version }} -> dev\` PR if it isn't merged yet"
          } >> "$GITHUB_STEP_SUMMARY"
