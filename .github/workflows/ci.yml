name: CI

on:
  pull_request:
    branches:
      - main
      - dev
      - 'release/**'
  push:
    branches:
      - main
      - dev
      - 'release/**'

jobs:
  web:
    name: Web (lint + build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --workspace=web

      - name: Unit tests
        run: npm test --workspace=web

      - name: Build
        run: npm run build --workspace=web

  e2e:
    name: Web (e2e smoke)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --workspace=web

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Run smoke tests
        run: npm run test:e2e --workspace=web

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  go:
    name: Go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [apps/api, apps/cli]
    # Only apps/api touches a database, but Postgres services are cheap and
    # scoped to the job — no reason to split apps/api into its own job just
    # to give it one. apps/cli's test step below simply never sets
    # TEST_DATABASE_URL, so its tests run exactly as before.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: whiparc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "${{ matrix.module }}/go.mod"
          cache-dependency-path: "${{ matrix.module }}/go.sum"

      - name: Build
        working-directory: ${{ matrix.module }}
        run: go build ./...

      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      - name: Test
        working-directory: ${{ matrix.module }}
        env:
          TEST_DATABASE_URL: ${{ matrix.module == 'apps/api' && 'postgres://postgres:postgres@localhost:5432/whiparc_test?sslmode=disable' || '' }}
        run: go test ./...
