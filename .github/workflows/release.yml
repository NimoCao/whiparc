name: Cut Platform Release

# Manual, deliberate release action — mirrors the comment in
# publish-base-image.yml: cutting a release is a manual-by-design step, not
# something that should fire automatically off a branch push. This workflow
# is the front door for that existing tag-based release mechanism: it
# creates release/vX.Y.Z from main, tags it, and cuts a GitHub Release. The
# tag push it makes is what actually triggers publish-api-image.yml and
# publish-base-image.yml (both already listen for `tags: v*`), which publish
# the images and move the floating `stable` tag the Hetzner VM pulls.
#
# This workflow does NOT deploy anything to the Hetzner VM itself — there is
# no CD hook to that box today. After this runs, `stable` is republished;
# picking it up on the VM is still a manual
# `docker compose -f docker-compose.hosted.yml pull && up -d`.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the v prefix (e.g. 1.0.0)'
        required: true
      base:
        description: 'Branch to cut the release from'
        required: false
        default: 'main'

permissions:
  contents: write

jobs:
  cut-release:
    name: Create release/v${{ inputs.version }} and tag it
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.base }}
          fetch-depth: 0

      - name: Validate version format
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be plain semver (e.g. 1.0.0), got '${{ inputs.version }}'"
            exit 1
          fi

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create release branch
        run: |
          git checkout -b "release/v${{ inputs.version }}"
          git push origin "release/v${{ inputs.version }}"

      - name: Tag the release
        run: |
          git tag -a "v${{ inputs.version }}" -m "Release v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ inputs.version }}" \
            --title "Whiparc v${{ inputs.version }}" \
            --target "release/v${{ inputs.version }}" \
            --generate-notes
