# nfpm config for the whiparc CLI — one spec produces both .deb and .rpm.
# nfpm itself doesn't expand ${VAR} placeholders in the config file, so CI
# resolves this template with `envsubst` before handing it to nfpm, once per
# arch/format combination:
#
#   VERSION=1.2.3 ARCH=amd64 BINARY_PATH=./whiparc-linux-amd64 \
#     envsubst < installers/linux/nfpm.yaml > /tmp/nfpm-amd64.yaml
#   nfpm package --config /tmp/nfpm-amd64.yaml --packager deb --target dist/
#   nfpm package --config /tmp/nfpm-amd64.yaml --packager rpm --target dist/
#
# (repeated for ARCH=arm64 with the matching binary). nfpm maps the Go-style
# arch name to each packager's own convention (e.g. amd64 -> x86_64 for rpm)
# automatically.
name: whiparc
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: "Whiparc <support@whiparc.dev>"
homepage: "https://whiparc.dev"
license: MIT
description: |
  Whiparc CLI — provision, validate, and manage Whiparc workspaces from
  your terminal.

contents:
  - src: ${BINARY_PATH}
    dst: /usr/bin/whiparc
    file_info:
      mode: 0755

  # Application launcher + icon (freedesktop hicolor theme), so the package
  # shows the Whiparc mark in desktop app menus. Paths are relative to the
  # repo root — CI runs nfpm from there. Icons are generated by
  # installers/generate-icons.py.
  - src: installers/linux/whiparc.desktop
    dst: /usr/share/applications/whiparc.desktop
    file_info:
      mode: 0644
  - src: installers/linux/icons/whiparc.svg
    dst: /usr/share/icons/hicolor/scalable/apps/whiparc.svg
    file_info:
      mode: 0644
  - src: installers/linux/icons/16x16.png
    dst: /usr/share/icons/hicolor/16x16/apps/whiparc.png
    file_info:
      mode: 0644
  - src: installers/linux/icons/24x24.png
    dst: /usr/share/icons/hicolor/24x24/apps/whiparc.png
    file_info:
      mode: 0644
  - src: installers/linux/icons/32x32.png
    dst: /usr/share/icons/hicolor/32x32/apps/whiparc.png
    file_info:
      mode: 0644
  - src: installers/linux/icons/48x48.png
    dst: /usr/share/icons/hicolor/48x48/apps/whiparc.png
    file_info:
      mode: 0644
  - src: installers/linux/icons/64x64.png
    dst: /usr/share/icons/hicolor/64x64/apps/whiparc.png
    file_info:
      mode: 0644
  - src: installers/linux/icons/128x128.png
    dst: /usr/share/icons/hicolor/128x128/apps/whiparc.png
    file_info:
      mode: 0644
  - src: installers/linux/icons/256x256.png
    dst: /usr/share/icons/hicolor/256x256/apps/whiparc.png
    file_info:
      mode: 0644
  - src: installers/linux/icons/512x512.png
    dst: /usr/share/icons/hicolor/512x512/apps/whiparc.png
    file_info:
      mode: 0644
